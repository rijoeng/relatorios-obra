<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Central Diário de Obra · Rijo</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F2F4F3; color: #1D2B26;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; box-sizing: border-box; text-align: center; }
  .c { max-width: 380px; background: #fff; border: 1px solid #DCE3DF; border-radius: 14px; padding: 24px 20px; }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: #4A5A54; font-size: 15px; }
  a { display: inline-block; background: #0F3D2E; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 10px; }
  #ic { display: none; font-size: 13.5px; margin: 16px 0 0; }
</style>
</head>
<body>
<div class="c">
  <h1>O endereço mudou</h1>
  <p>Agora é <b>rijoeng.github.io/centraldiariodeobras</b></p>
  <a id="ir" href="/centraldiariodeobras/">Abrir Central Diário de Obra</a>
  <p id="ic">Abrindo… Se usa pelo ícone na tela inicial, abra o endereço novo e adicione de novo à tela inicial.</p>
</div>
<script>
  (function () {
    var novo = '/centraldiariodeobras/' + location.search + location.hash;   // mantém o link pessoal (?t=…)
    document.getElementById('ir').href = novo;
    var icone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    if (icone) { document.getElementById('ic').style.display = 'block'; setTimeout(function () { location.replace(novo); }, 3500); }
    else location.replace(novo);
  })();
</script>
</body>
</html>
