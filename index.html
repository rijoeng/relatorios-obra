<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0F3D2E">
<title>Diário de obra · Rijo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Diário Rijo">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
  /* Diário de Obra Rijo · prévia v0.6.0 — app de leitura e correção dos RDOs, celular primeiro.
     Layout: cabeçalho branco Rijo fixo · conteúdo numa coluna (lista → obra → RDO) · barra de baixo no celular,
     abas no cabeçalho no computador. Sempre no modo claro (regra Rijo de 10/10). */
  :root {
    --verde: #0F3D2E; --verde-2: #2F7D50; --verde-3: #E3EFE7; --verde-tinta: #1D5C43; --acento: #8CCBA5;
    --fundo: #F2F4F3; --papel: #FFFFFF; --papel-2: #F6F8F7; --linha: #DCE3DF; --linha-forte: #C3CEC8;
    --texto: #1B2A24; --texto-2: #51625C; --texto-3: #6C7D77;
    --ok: #2A7A4B; --ok-f: #E2F1E7;
    --atencao: #8A5A00; --atencao-f: #FBF0D3; --atencao-m: #E3A04F;
    --atrasado: #A8461F; --atrasado-f: #FBE5DA; --atrasado-m: #D9773F;
    --critico: #9E3B27; --critico-f: #F7DFD9; --critico-m: #C4513A;
    --sem: #5F6B67; --sem-f: #E8ECEA;
    --azul: #2B5F8A; --azul-f: #E3EDF5; --int-f: #EEF2F8;
    --palco: #0B1210; --ink: #F4F7F5; --ink-2: rgba(244,247,245,.8); --ink-3: rgba(244,247,245,.58);
    --sombra: 0 1px 2px rgba(15,61,46,.06), 0 2px 8px rgba(15,61,46,.05);
    --sombra-2: 0 8px 28px rgba(11,25,19,.18);
    --raio: 12px;
    --fonte: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    --cond: "Barlow Semi Condensed", "Barlow", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
    --cab-h: 60px; --nav-h: 64px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--fundo); color: var(--texto); }
  body { margin: 0; font-family: var(--fonte); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 2px solid var(--verde-2); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 18px; height: 18px; flex: none; }

  /* ---------- cabeçalho ---------- */
  .cab { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--cab-h); background: var(--papel); border-bottom: 1px solid var(--linha);
    display: flex; align-items: center; gap: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .marca .logo { height: 32px; width: auto; display: block; flex: none; }
  .certs { display: flex; align-items: center; gap: 8px; margin-left: 6px; flex: none; }
  .certs img { display: block; width: auto; flex: none; }   /* logo → selos ≈ 0,6 × altura da logo */
  .certs .iso { height: 32px; } .certs .pbqph { height: 22px; }
  .cab .div { width: 1px; height: 26px; background: var(--linha); flex: none; }
  .sis-nome { font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; line-height: 1.1; white-space: nowrap; }
  .sis-sub { font-size: 12px; color: var(--texto-3); white-space: nowrap; }
  .abas { display: none; gap: 4px; margin-left: 8px; }
  .abas button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--texto-2); display: inline-flex; gap: 7px; align-items: center; }
  .abas button:hover { background: var(--papel-2); color: var(--texto); }
  .abas button[aria-current="true"] { background: var(--verde-3); color: var(--verde); }
  .cab-dir { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .cab .btn-cab { display: none; }
  .eu { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--linha-forte); background: var(--verde-3); color: var(--verde); font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; }
  .eu:hover { border-color: var(--verde-2); }

  .previa-x { background: #FFF7E0; border-bottom: 1px solid #F0DFAE; color: #6B4B00; font-size: 12.5px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; }
  .previa-x b { font-family: var(--cond); letter-spacing: .1em; text-transform: uppercase; font-size: 12px; }
  .previa-x button { border: 0; background: none; color: #6B4B00; text-decoration: underline; padding: 0; font-size: 12.5px; font-weight: 600; margin-left: auto; }

  /* ---------- área principal ---------- */
  main { max-width: 1120px; margin: 0 auto; padding-block: 18px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .vista { display: flex; flex-direction: column; gap: 18px; }
  .topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
  .topo h1 { font-family: var(--cond); font-weight: 700; font-size: 26px; line-height: 1.1; text-wrap: balance; }
  .topo h1 small { font-size: 16px; color: var(--texto-3); font-weight: 600; margin-left: 6px; }
  .topo p { color: var(--texto-2); font-size: 14px; margin-top: 3px; }
  .rot { font-family: var(--cond); font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--texto-3); }
  .sec-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .sec-cab h2 { font-family: var(--cond); font-size: 20px; font-weight: 700; }
  .link { border: 0; background: none; color: var(--verde-2); font-weight: 600; font-size: 14px; padding: 4px 0; }
  .link:hover { text-decoration: underline; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--linha-forte); background: var(--papel);
    color: var(--texto); font-weight: 600; font-size: 14.5px; white-space: nowrap; text-decoration: none; transition: border-color .15s, background .15s, filter .15s; }
  .btn:hover { border-color: var(--verde-2); }
  .btn.pri { background: var(--verde-2); border-color: var(--verde-2); color: #fff; }
  .btn.pri:hover { filter: brightness(1.07); }
  .btn.esc { background: var(--verde); border-color: var(--verde); color: #fff; }
  .btn.peq { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 8px; }
  .btn.perigo { color: var(--critico); }
  .btn[disabled] { opacity: .5; cursor: default; filter: none; }
  .btn svg { width: 17px; height: 17px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--linha-forte); background: var(--papel); border-radius: 99px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; color: var(--texto-2); display: inline-flex; gap: 6px; align-items: center; }
  .chip b { font-variant-numeric: tabular-nums; color: var(--texto-3); font-weight: 600; }
  .chip[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
  .chip[aria-pressed="true"] b { color: var(--acento); }

  .busca { position: relative; }
  .busca input { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--linha-forte); background: var(--papel); padding: 0 14px 0 40px; font-size: 15px; }
  .busca svg { position: absolute; left: 12px; top: 13px; color: var(--texto-3); }

  /* pílulas de situação */
  .pil { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 3px 10px 3px 8px; font-size: 12.5px; font-weight: 700; line-height: 1.3; white-space: nowrap; }
  .pil i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .pil.ok { color: var(--ok); background: var(--ok-f); }
  .pil.atencao { color: var(--atencao); background: var(--atencao-f); }
  .pil.atrasado { color: var(--atrasado); background: var(--atrasado-f); }
  .pil.critico { color: var(--critico); background: var(--critico-f); }
  .pil.sem { color: var(--sem); background: var(--sem-f); }
  .tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 2px 7px; font-size: 12px; font-weight: 600; line-height: 1.35; white-space: nowrap; border: 1px solid var(--linha); color: var(--texto-2); background: var(--papel-2); }
  .tag.app { color: var(--verde-tinta); background: var(--verde-3); border-color: #CFE3D6; }
  .tag.migrado { color: var(--azul); background: var(--azul-f); border-color: #CADCEB; }
  .tag.corrigido { color: #fff; background: var(--verde-2); border-color: var(--verde-2); }
  .tag.prep { color: var(--atencao); background: var(--atencao-f); border-color: #EFD9A3; }
  .tag svg { width: 13px; height: 13px; }

  /* ---------- lista de obras ---------- */
  .obras { display: grid; gap: 10px; }
  .obra-c { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: stretch; text-align: left; width: 100%; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--papel); padding: 10px; box-shadow: var(--sombra); }
  .obra-c:hover { border-color: var(--linha-forte); }
  .capa { position: relative; border-radius: 9px; overflow: hidden; background: linear-gradient(135deg, #DCE7E0, #C7D8CE); aspect-ratio: 1 / 1; max-width: 100%; }
  .capa img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .capa .ini { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--cond); font-weight: 700; font-size: 20px; color: var(--verde-tinta); letter-spacing: .02em; }
  .obra-c .info { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .obra-c .pil { align-self: flex-start; }
  .obra-c .nome { font-weight: 600; font-size: 15px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .obra-c .nome b { font-family: var(--cond); font-weight: 700; color: var(--verde); font-size: 16.5px; margin-right: 4px; }
  .obra-c .meta { display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; color: var(--texto-3); font-size: 13px; margin-top: auto; }
  .obra-c .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .obra-c .meta svg { width: 15px; height: 15px; }
  .vazio { padding: 34px 18px; text-align: center; background: var(--papel); border: 1px dashed var(--linha-forte); border-radius: var(--raio); color: var(--texto-2); }
  .vazio h3 { font-family: var(--cond); font-size: 20px; color: var(--texto); margin-bottom: 4px; }

  /* ---------- obra ---------- */
  .hero { position: relative; border-radius: 16px; overflow: hidden; min-height: 210px; background: linear-gradient(135deg, #2C5B48, #0F3D2E); color: #fff; display: flex; flex-direction: column; justify-content: flex-end; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(6,14,11,.92) 0%, rgba(6,14,11,.7) 42%, rgba(6,14,11,.2) 72%, rgba(6,14,11,.3) 100%); }
  .hero > * { position: relative; z-index: 1; }
  .hero .voltar { position: absolute; top: 12px; left: 12px; z-index: 2; }
  .hero .txt { padding: 54px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
  .hero .cod { align-self: flex-start; font-family: var(--cond); font-weight: 700; font-size: 15px; color: #fff; background: var(--verde-2); letter-spacing: .05em; padding: 2px 9px; border-radius: 6px; }
  .hero h1 { font-family: var(--cond); font-weight: 700; font-size: 27px; line-height: 1.08; text-wrap: balance; text-shadow: 0 2px 12px rgba(0,0,0,.4); }
  .hero .sub { font-size: 13.5px; font-weight: 500; color: #fff; display: flex; gap: 6px 12px; flex-wrap: wrap; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
  .vbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(9,16,13,.55); color: #fff; display: inline-flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .vbtn:hover { background: rgba(9,16,13,.8); }
  .vbtn.claro { background: var(--papel); color: var(--texto); border: 1px solid var(--linha); backdrop-filter: none; }
  .vbtn.claro:hover { border-color: var(--verde-2); }

  .sub-abas { display: flex; gap: 4px; border-bottom: 1px solid var(--linha); }
  .sub-abas button { border: 0; background: none; padding: 10px 14px; font-weight: 600; font-size: 14.5px; color: var(--texto-2); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .sub-abas button[aria-selected="true"] { color: var(--verde); border-bottom-color: var(--verde-2); }

  .sit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px 16px; box-shadow: var(--sombra); }
  .sit .l1 { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
  .sit .l2 { margin-top: 4px; color: var(--texto-2); font-size: 14px; }
  .cal { display: grid; grid-template-columns: repeat(31, minmax(0, 1fr)); gap: 3px; margin-top: 10px; grid-column: 1 / -1; }
  .cal button, .cal span { aspect-ratio: 1 / 1.5; border-radius: 3px; border: 0; padding: 0; background: var(--sem-f); max-width: 100%; }
  .cal .f { background: var(--verde-2); }
  .cal .f.tem { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }
  .cal .x { background: #E8BDB2; }
  .cal .h { background: var(--papel); box-shadow: inset 0 0 0 1.5px var(--linha-forte); }
  .cal .h.f { background: var(--verde-2); box-shadow: none; }
  .cal-leg { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; color: var(--texto-3); font-size: 12px; }

  .numeros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .nb { background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px 10px; text-align: center; box-shadow: var(--sombra); }
  .nb b { display: block; font-family: var(--cond); font-weight: 700; font-size: 28px; line-height: 1; color: var(--verde); font-variant-numeric: tabular-nums; }
  .nb span { display: block; margin-top: 5px; font-size: 12.5px; color: var(--texto-2); line-height: 1.2; }
  .nb.alerta b { color: var(--atrasado); }
  button.nb { font: inherit; width: 100%; }
  button.nb:hover { border-color: var(--linha-forte); }

  .revisar { background: var(--papel); border: 1px solid var(--linha); border-left: 4px solid var(--atencao-m); border-radius: var(--raio); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .revisar h3 { font-family: var(--cond); font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .revisar h3 svg { color: var(--atencao-m); width: 20px; height: 20px; }
  .revisar p.d { color: var(--texto-2); font-size: 13.5px; }
  .pontos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .pontos li + li { border-top: 1px solid var(--linha); }
  .pontos button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 0; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: start; font-size: 14px; }
  .pontos button:hover .t { text-decoration: underline; }
  .pontos .s { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--atencao-m); }
  .pontos .s.alto { background: var(--critico-m); }
  .pontos .s.info { background: var(--linha-forte); }
  .pontos .pq { color: var(--texto-3); font-size: 12.5px; white-space: nowrap; margin-top: 2px; }

  .faixa-fotos { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 34%); gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; scrollbar-width: thin; }
  .faixa-fotos .q { scroll-snap-align: start; }

  /* quadros de foto */
  .q { position: relative; display: block; aspect-ratio: 4 / 3; border: 0; padding: 0; border-radius: 10px; overflow: hidden; background: #D5DED9; max-width: 100%; }
  .q img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .q:hover img { transform: scale(1.04); }
  .q::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,16,13,.72), rgba(8,16,13,0) 48%); pointer-events: none; }
  .q .qt { position: absolute; z-index: 1; left: 8px; right: 8px; bottom: 6px; color: #fff; font-size: 12px; font-weight: 600; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .q .qd { position: absolute; z-index: 1; top: 6px; left: 6px; font-size: 11px; font-weight: 700; color: var(--texto); background: rgba(255,255,255,.9); padding: 1px 6px; border-radius: 5px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .semana + .semana { margin-top: 18px; }
  .semana h3 { font-family: var(--cond); font-size: 18px; margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .semana h3 span { font-family: var(--fonte); font-size: 13px; color: var(--texto-3); font-weight: 500; }

  /* lista de relatórios */
  .rlista { display: flex; flex-direction: column; background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra); overflow: hidden; }
  .rl { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 0; background: none; width: 100%; text-align: left; }
  .rl + .rl { border-top: 1px solid var(--linha); }
  button.rl:hover { background: var(--papel-2); }
  .rl .dia { text-align: center; line-height: 1; }
  .rl .dia b { display: block; font-family: var(--cond); font-weight: 700; font-size: 25px; color: var(--texto); font-variant-numeric: tabular-nums; }
  .rl .dia span { display: block; margin-top: 3px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-3); }
  .rl .c { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .rl .t1 { display: flex; gap: 6px 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
  .rl .t1 .n { font-family: var(--cond); font-size: 17px; color: var(--verde); }
  .rl .t1 .ob { font-family: var(--cond); font-size: 15px; color: var(--texto-2); }
  .rl .t2 { color: var(--texto-2); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rl .d { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; color: var(--texto-3); font-size: 12.5px; }
  .rl .d span { display: inline-flex; gap: 4px; align-items: center; }
  .rl .d svg { width: 14px; height: 14px; }
  .rl .alerta-p { width: 9px; height: 9px; border-radius: 50%; background: var(--atencao-m); display: inline-block; }
  .rl.falta { background: repeating-linear-gradient(135deg, #FBF6F4 0 10px, #F8EFEC 10px 20px); }
  .rl.falta .dia b { color: var(--critico); }
  .rl.falta .t1 { color: var(--critico); }
  .rl.sem-dado .t1 { color: var(--texto-2); }
  .dia-cab { padding: 8px 14px; background: var(--papel-2); font-family: var(--cond); font-weight: 700; font-size: 14px; letter-spacing: .04em; color: var(--texto-2); border-top: 1px solid var(--linha); }
  .dia-cab:first-child { border-top: 0; }
  .nota { color: var(--texto-3); font-size: 13px; text-align: center; padding: 6px 10px; }

  /* ---------- RDO (formato Rijo) ---------- */

function capaImg(o, grande) {
  if (!o.capa) return '';
  if (o.capa.up) return '<img data-capa="' + esc(o.codigo) + '" src="' + (CAPAS[o.codigo] || VAZIA) + '" alt="">';
  return imgK({ k: o.capa.k, m: o.capa.m }, '', grande ? ' data-grande="1"' : '');
}

/* ---------- situação do diário (mesma regra do painel: 1 por dia corrido; o de hoje vale até o fim do dia) ---------- */
function situacao(o) {
  if (o.encerrada) return { s: 'sem', a: null, txt: 'Encerrada · sem cobrança', fora: true };
  if (o.aguardando) return { s: 'sem', a: null, txt: 'Sem cobrança' + (o.etapa ? ' (' + o.etapa + ')' : ''), fora: true };
  if (!o.ultimo) return { s: 'critico', a: null, txt: 'Nenhum diário' };
  const a = o.ultimo.dia >= ONTEM ? 0 : diasEntre(o.ultimo.dia, ONTEM);
  const s = a === 0 ? 'ok' : a <= 2 ? 'atencao' : a < 7 ? 'atrasado' : 'critico';
  return { s, a, txt: a === 0 ? 'Em dia' : a + (a === 1 ? ' dia' : ' dias') + ' sem diário' };
}
function pilula(o) { const x = situacao(o); return '<span class="pil ' + x.s + '"><i></i>' + esc(x.txt) + '</span>'; }
function ultimoTxt(o) {
  if (!o.ultimo) return 'Nenhum diário na Vobi';
  return 'Último: ' + rotuloDia(o.ultimo.dia) + (o.ultimo.codigo ? ' · nº ' + o.ultimo.codigo : '');
}
function diasDoCalendario(o) {
  const out = [];
  const cal = String(o.calendario || '');
  const ini = o.inicioCal || somarDias(ONTEM, -29);
  for (let i = 0; i < 30; i++) out.push({ d: somarDias(ini, i), c: cal.charAt(i) || '-' });
  out.push({ d: HOJE, c: 'h' });
  return out;
}

/* ---------- pontos a revisar ---------- */
function pontosRdo(r) {
  const p = [];
  const o = OBRA[r.obra];
  const doMes = rdosDaObra(r.obra).slice().reverse();
  const n = Number(r.codigo);
  if (!isNaN(n) && r.codigo !== '') {
    const antes = doMes.filter((x) => x.dia < r.dia && !isNaN(Number(x.codigo)));
    const maior = antes.reduce((m, x) => (Number(x.codigo) > Number(m ? m.codigo : -1) ? x : m), null);
    if (maior && n < Number(maior.codigo)) p.push({ s: 'alto', t: 'Número fora de ordem: nº ' + r.codigo + ' veio depois do nº ' + maior.codigo + ' (' + ddmm(maior.dia) + ')' });
    const rep = doMes.filter((x) => x !== r && x.codigo === r.codigo);
    if (rep.length) p.push({ s: 'alto', t: 'Número repetido: outro diário nº ' + r.codigo + ' em ' + ddmm(rep[0].dia) });
    if (n === 1 && o && o.desde && o.desde < r.dia.slice(0, 7)) p.push({ s: 'alto', t: 'Numeração recomeçou: nº 1, mas a obra tem diários na Vobi desde ' + mesAno(o.desde.slice(0, 7)) });
  }
  if (!engenheiroDe(r)) p.push({ s: 'med', t: 'Sem responsável pelo diário' });
  if (!r.clima.some((c) => c.tempo)) p.push({ s: 'med', t: 'Sem clima do dia' });
  if (!r.equipe.length) p.push({ s: 'med', t: 'Efetivo do dia não informado' });
  if (!r.servicos.length && !r.atividades.length && !String(r.descricao || '').trim() && !String(r.ocorrencias || '').trim() && !(r.comentarios || []).length) p.push({ s: 'med', t: 'Sem descrição do que foi feito' });
  const sl = r.fotos.filter((f) => !String(f.t || '').trim()).length + (r.semLegendaFora || 0);
  if (sl) p.push({ s: 'baixo', t: plural(sl, 'foto sem legenda', 'fotos sem legenda') });
  return p;
}
function pontosObra(o) {
  const lista = [];
  filaDaObra(o.codigo).forEach((f) => lista.push({ s: 'alto', t: tituloFila(f) + ' (' + ddmm(f.dia) + '): ' + (f.status === 'aguardando-fotos' ? 'faltam ' + (f.esperadas - f.recebidas) + ' de ' + f.esperadas + ' fotos' : f.status === 'erro' ? 'a Vobi recusou a gravação' : 'ainda não chegou na Vobi'), q: ddmm(f.dia), ir: () => { const el = $('#filaCard'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }));
  const eq = equipeDaObra(o.codigo);
  const inc = eq.filter((c) => faltaCadastro(c).length).length;
  const rep = eq.filter((c) => repetidos(c).length).length;
  if (rep) lista.push({ s: 'med', t: plural(rep, 'possível cadastro repetido', 'possíveis cadastros repetidos') + ' na equipe', q: 'equipe', ir: () => { atual().p.aba = 'equipe'; render(); } });
  if (inc) lista.push({ s: 'baixo', t: plural(inc, 'cadastro incompleto', 'cadastros incompletos') + ' na equipe (documento, telefone ou vínculo)', q: 'equipe', ir: () => { atual().p.aba = 'equipe'; render(); } });
  if (o.faltas && !situacao(o).fora) lista.push({ s: o.faltas >= 7 ? 'alto' : 'med', t: plural(o.faltas, 'dia sem diário', 'dias sem diário') + ' nos últimos 30', q: 'ver dias', ir: () => ir('obra', { cod: o.codigo, aba: 'relatorios' }) });
  rdosDaObra(o.codigo).forEach((r) => {
    const p = pontosRdo(r);
    if (!p.length) return;
    const pior = p.some((x) => x.s === 'alto') ? 'alto' : p.some((x) => x.s === 'med') ? 'med' : 'baixo';
    lista.push({ s: pior, t: 'nº ' + r.codigo + ' · ' + p.map((x) => x.t).join(' · '), q: ddmm(r.dia), ir: () => ir('rdo', { id: r.id }) });
  });
  const peso = { alto: 0, med: 1, baixo: 2 };
  return lista.sort((a, b) => peso[a.s] - peso[b.s]);
}

/* ---------- navegação (pilha interna; a página não mexe no histórico do navegador) ---------- */
function ir(v, p, op) {
  op = op || {};
  if (op.raiz) S.pilha = [];
  if (op.trocar) S.pilha.pop();
  S.pilha.push({ v, p: p || {} });
  render(true);
}
function voltar() {
  if (atual().v === 'corrigir') {
    if (S.ed && S.ed.sujo) { pedirDescarte(() => { S.ed = null; voltar(); }); return; }
    S.ed = null;
  }
  if (S.pilha.length > 1) S.pilha.pop(); else S.pilha = [{ v: 'obras', p: {} }];
  render(true);
}
function atual() { return S.pilha[S.pilha.length - 1] || { v: 'obras', p: {} }; }
function raizDe(v) { return v === 'relatorios' ? 'relatorios' : v === 'fotos' ? 'fotos' : 'obras'; }

function render(subir) {
  const y = window.scrollY;
  const a = atual();
  document.body.classList.toggle('editando', a.v === 'corrigir');
  const raiz = raizDe(a.v);
  const logado = !!(S.pessoa && D);
  $$('[data-tab]').forEach((b) => b.setAttribute('aria-current', String(b.dataset.tab === raiz && logado)));
  $('#abas').hidden = !logado; $('#cabDir').hidden = !logado; $('#navb').hidden = !logado || a.v === 'corrigir';
  if (logado) { $('#eu').textContent = iniciais(S.pessoa.nome); $('#cabSub').textContent = S.pessoa.nome + (S.pessoa.obras === '*' ? ' · todas as obras' : ' · ' + plural(S.pessoa.obras.length, 'obra', 'obras')); }
  else $('#cabSub').textContent = 'Relatórios diários das obras';
  const m = $('#main');
  const fn = { entrar: vEntrar, obras: vObras, obra: vObra, rdo: vRdo, corrigir: vCorrigir, relatorios: vRelatorios, fotos: vFotos }[logado ? a.v : 'entrar'] || vObras;
  m.innerHTML = '';
  fn(m, a.p);
  pintarMinis(m);
  window.scrollTo(0, subir === false ? y : 0);
}

/* ---------- entrar ---------- */

    '<div class="campo"><span class="lb" id="lbDig">4 últimos números do celular</span><div class="digitos" role="group" aria-labelledby="lbDig">' +
    [0, 1, 2, 3].map((i) => '<input id="dg' + i + '" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Número ' + (i + 1) + '">').join('') + '</div>' +
    '<span class="fora" id="entMsg" role="alert"></span></div>' +
    '<button type="button" class="btn pri" id="btEntrar" disabled>Entrar</button></section>';
  $$('.pessoa', m).forEach((b) => b.addEventListener('click', () => { S.escolha = b.dataset.p; $$('.pessoa', m).forEach((x) => { const s = x === b; x.setAttribute('aria-pressed', String(s)); x.setAttribute('aria-checked', String(s)); }); conferir(); $('#dg0').focus(); }));
  const dg = $$('.digitos input', m);
  const conferir = () => { $('#btEntrar').disabled = !(S.escolha || sel) || dg.some((x) => !/^\d$/.test(x.value)); };
  dg.forEach((x, i) => {
    x.addEventListener('input', () => { x.value = x.value.replace(/\D/g, '').slice(-1); if (x.value && dg[i + 1]) dg[i + 1].focus(); conferir(); });

    srv('appEntrar', nome, dg.map((x) => x.value).join('')).then((r) => {
      S.token = r.token; guardar(TK, r.token); guardar(NM, r.nome);

}
function carregarTudo(manter) {
  S.iniciando = true;
  if (!manter) { S.pilha = [{ v: 'entrar', p: {} }]; render(); }
  return srv('appInicio', S.token).then((j) => {
    S.iniciando = false;
    aplicarDados(j, manter);
    S.lidoEm = Date.now();
    if (!manter) S.obraCarregada = {};
    if (!manter) S.pilha = [{ v: 'obras', p: {} }];
    render(!manter ? true : false);
    pedirCapas();
  }).catch((e) => {
    S.iniciando = false;
    if (e.codigo === 'token') return;
    if (manter) { toast(e.message); return; }
    const m = $('#main'); m.innerHTML = erroHtml(e.message, 'Tentar de novo');
    const b = $('#tentarDeNovo', m); if (b) b.addEventListener('click', () => carregarTudo());
  });
}

/* ---------- obra ---------- */
function garantirObra(cod) {
  if (S.obraCarregada[cod] || S.obraCarregando[cod]) return;
  S.obraCarregando[cod] = true;
  srv('appObra', S.token, cod).then((r) => {
    juntarRdos(r.rdos);
    S.obraCarregada[cod] = true;
    const a = atual();
    if ((a.v === 'obra' && a.p.cod === cod) || a.v === 'rdo') render(false);
  }).catch((e) => toast(e.message)).finally(() => { S.obraCarregando[cod] = false; });
}
function vObra(m, p) {
  const o = OBRA[p.cod];
  if (!o || !pessoaPode(o.codigo)) { m.innerHTML = '<div class="vazio"><h3>Obra fora do seu acesso</h3></div>'; return; }
  garantirObra(o.codigo);
  const aba = p.aba || 'geral';
  const rdos = rdosDaObra(o.codigo);
  const sit = situacao(o);
  const resp = responsaveis(o.codigo);
  const sub = [];
  if (resp.length) sub.push('Responsável: ' + resp.join(', '));
  if (o.total) sub.push(plural(o.total, 'relatório', 'relatórios') + (o.desde ? ' desde ' + mesAno(o.desde) : ''));
  m.innerHTML = '<section class="vista">' +
    '<div class="hero">' + (o.capa ? capaImg(o, true) : '') +
    '<button type="button" class="vbtn voltar" id="volta" aria-label="Voltar">' + ic('voltar') + '</button>' +
    (pessoaPode(o.codigo) ? '<button type="button" class="btn peq capa-btn" id="trocaCapa">' + ic('camera') + 'Trocar capa</button>' : '') +
    '<div class="txt"><div class="cod">' + esc(o.codigo) + '</div><h1>' + esc(o.nome) + '</h1><div class="sub">' + sub.map((x) => '<span>' + esc(x) + '</span>').join('') + '</div></div></div>' +
    '<div class="sub-abas" role="tablist">' + [['geral', 'Visão geral'], ['relatorios', 'Relatórios'], ['fotos', 'Fotos'], ['equipe', 'Equipe']].map((x) => '<button type="button" role="tab" data-aba="' + x[0] + '" aria-selected="' + (aba === x[0]) + '">' + x[1] + (x[0] === 'equipe' ? ' <b class="num">' + equipeDaObra(o.codigo).length + '</b>' : '') + '</button>').join('') + '</div>' +
    (S.obraCarregando[o.codigo] && !S.obraCarregada[o.codigo] ? '<div class="carreg linha" role="status"><i></i><span>Trazendo todos os relatórios desta obra…</span></div>' : '') +
    '<div id="obraCorpo" class="vista"></div></section>';
  $('#volta', m).addEventListener('click', () => voltar());
  const tc = $('#trocaCapa', m); if (tc) tc.addEventListener('click', () => abrirCapa(o));
  $$('[data-aba]', m).forEach((b) => b.addEventListener('click', () => { atual().p.aba = b.dataset.aba; render(false); }));
  const c = $('#obraCorpo', m);
  if (aba === 'geral') obraGeral(c, o, rdos, sit);
  else if (aba === 'relatorios') obraRelatorios(c, o, rdos);
  else if (aba === 'equipe') obraEquipe(c, o);
  else obraFotos(c, o, rdos);
}

/* ---------- capa da obra ---------- */
function abrirCapa(o) {
  const fotos = fotosDe(rdosDaObra(o.codigo)).slice(0, 120);
  const atualK = o.capa && o.capa.k;
  const v = camada('<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cpT"><h2 id="cpT">Foto da capa · ' + esc(o.codigo) + '</h2>' +
    '<p class="d">Aparece na lista de obras e no topo da obra, para todo mundo. Escolha uma foto dos diários ou mande uma do celular.</p>' +
    (fotos.length ? '<div class="capa-grade">' + fotos.map((f, i) => '<button type="button" class="q' + (f.k === atualK ? ' atual' : '') + '" data-cp="' + i + '" aria-pressed="' + (f.k === atualK) + '">' + imgK(f, f.t || 'Foto') + '<span class="qd">' + esc(ddmm(f.r.dia)) + '</span>' + (f.k === atualK ? '<span class="qt">Capa atual</span>' : '') + '</button>').join('') + '</div>'
      : '<p class="fora">' + (S.obraCarregada[o.codigo] ? 'Esta obra ainda não tem fotos de diário no acervo.' : 'Carregando as fotos desta obra…') + '</p>') +
    '<label class="add-foto">' + ic('camera') + '<span>Mandar uma foto do celular</span><input type="file" id="capaArq" accept="image/*"></label>' +
    '<p class="fora" id="cpMsg" role="status"></p>' +
    '<div class="acoes"><button type="button" class="btn" id="cpF">Fechar</button></div></div>');
  pintarMinis(v);
  const gravarCapa = (dados, src) => {
    $('#cpMsg', v).textContent = 'Gravando a capa…';
    $$('button', v).forEach((b) => { b.disabled = true; });
    srv('appSalvarCapa', S.token, o.codigo, dados).then((r) => {
      o.capa = r.capa; if (src) CAPAS[o.codigo] = src;
      fecharCamada(); render(false); toast('Capa da ' + o.codigo + ' trocada para todos.');
    }).catch((e) => { $('#cpMsg', v).textContent = e.message; $$('button', v).forEach((b) => { b.disabled = false; }); });
  };
  $$('[data-cp]', v).forEach((b) => b.addEventListener('click', () => { const f = fotos[Number(b.dataset.cp)]; gravarCapa({ k: f.k, m: f.m }); }));
  $('#capaArq', v).addEventListener('change', (e) => {
    const a = e.target.files && e.target.files[0]; if (!a) return;
    reduzirFoto(a, 1024, 0.82).then((src) => gravarCapa({ base64: src, mime: 'image/jpeg' }, src)).catch(() => toast('Não consegui abrir essa foto.'));
  });
  $('#cpF', v).addEventListener('click', fecharCamada);
}

  c.innerHTML = '<div class="aviso-p interno">' + ic('cadeado') + '<div><b>Interno Rijo.</b> Nomes, vínculo e empresa ficam só aqui, no app 06 e no RH.01 (é o mesmo cadastro). Na Vobi, que vai para o cliente, o diário leva só a função e a quantidade.</div></div>' +

function linhaRdo(r, mostrarObra) {
  const pts = pontosRdo(r);
  const nf = r.fotos.length + (r.fora || 0);

  const pend = S.pendentes[r.id];
  return '<button type="button" class="rl" data-rdo="' + esc(r.id) + '"><span class="dia"><b>' + r.dia.slice(8) + '</b><span>' + esc(semCurta(r.dia)) + ' · ' + esc(MESES[Number(r.dia.slice(5, 7)) - 1].slice(0, 3)) + '</span></span>' +
    '<span class="c"><span class="t1">' + (mostrarObra ? '<span class="ob">' + esc(r.obra) + '</span>' : '') + '<span class="n">RDO nº ' + esc(r.codigo || '—') + '</span>' +
    (r.status === 'preparing' ? '<span class="tag prep">Em preparação</span>' : '') + (r.origem !== 'vobi' ? '<span class="tag ' + r.origem + '">' + esc(ORIGEM[r.origem]) + '</span>' : '') +
    (pend ? '<span class="tag fila-t">' + ic('fila') + 'Corrigindo</span>' : nCorr(r) ? '<span class="tag corrigido">' + ic('lapis') + 'Corrigido</span>' : '') + '</span>' +
    '<span class="t2">' + esc((engenheiroDe(r) ? engenheiroDe(r) + ' · ' : '') + String(resumo).split('\n')[0]) + '</span></span>' +
    '<span class="d">' + (pts.length ? '<span title="' + esc(pts.map((x) => x.t).join(' · ')) + '"><i class="alerta-p"></i>' + pts.length + '</span>' : '') +
    '<span>' + ic('camera') + nf + '</span>' + (eq ? '<span>' + ic('equipe') + eq + '</span>' : '') + '</span></button>';
}
function linhaFila(f, mostrarObra) {
  return '<div class="rl filaL"><span class="dia"><b>' + f.dia.slice(8) + '</b><span>' + esc(semCurta(f.dia)) + ' · ' + esc(MESES[Number(f.dia.slice(5, 7)) - 1].slice(0, 3)) + '</span></span>' +

    '<span class="t2">' + esc(textoFila(f)) + '</span></span><span class="d"><span>' + ic('camera') + f.recebidas + '/' + f.esperadas + '</span><span>' + ic('equipe') + f.presentes + '</span></span></div>';
}
function ligarLinhasRdo(c) { $$('button.rl[data-rdo]', c).forEach((b) => b.addEventListener('click', () => ir('rdo', { id: b.dataset.rdo }))); }

function obraRelatorios(c, o, rdos) {
  const porDia = {}; rdos.forEach((r) => { (porDia[r.dia] = porDia[r.dia] || []).push(r); });
  const linhas = [];
  const cal = diasDoCalendario(o).reverse();
  const vistos = {};
  const filaDia = {}; filaDaObra(o.codigo).forEach((f) => { (filaDia[f.dia] = filaDia[f.dia] || []).push(f); });
  const fora = situacao(o).fora;
  let seguidos = [];
  const fechar = () => {
    if (seguidos.length >= 3) {
      const a = seguidos[seguidos.length - 1], b = seguidos[0];
      linhas.push('<div class="rl falta"><span class="dia"><b>' + seguidos.length + '</b><span>dias</span></span><span class="c"><span class="t1">Sem diário · ' + seguidos.length + ' dias seguidos</span><span class="t2">De ' + esc(ddmm(a)) + ' a ' + esc(ddmm(b)) + ' · lançar pelo app 06</span></span><span class="d"></span></div>');
    } else seguidos.forEach((d) => linhas.push('<div class="rl falta"><span class="dia"><b>' + d.slice(8) + '</b><span>' + esc(semCurta(d)) + '</span></span><span class="c"><span class="t1">Sem diário</span><span class="t2">' + esc(dataLonga(d)) + ' · lançar pelo app 06</span></span><span class="d"></span></div>'));
    seguidos = [];
  };
  cal.forEach((x) => {
    vistos[x.d] = true;
    const falta = !porDia[x.d] && !filaDia[x.d] && !fora && x.c !== 'h' && (x.c === '0' || (x.c === '-' && !o.calendario));
    if (falta) { seguidos.push(x.d); return; }
    fechar();
    (filaDia[x.d] || []).forEach((f) => linhas.push(linhaFila(f, false)));
    if (porDia[x.d]) porDia[x.d].forEach((r) => linhas.push(linhaRdo(r, false)));
    else if (x.c === '1' && !fora) linhas.push('<div class="rl sem-dado"><span class="dia"><b>' + x.d.slice(8) + '</b><span>' + esc(semCurta(x.d)) + '</span></span><span class="c"><span class="t1">Diário lançado na Vobi</span><span class="t2">Aparece aqui na próxima leitura (até 15 minutos)</span></span><span class="d"></span></div>');
  });
  fechar();
  const antigos = rdos.filter((r) => !vistos[r.dia]);
  c.innerHTML = '<div class="sec-cab"><h2>Últimos 30 dias</h2><span class="fora">' + (fora ? 'sem cobrança' : (o.feitos || 0) + ' com diário · ' + (o.faltas || 0) + ' sem') + '</span></div>' +
    '<div class="rlista">' + (linhas.join('') || '<div class="nota">Nenhum diário nos últimos 30 dias.</div>') + '</div>' +
    (antigos.length ? '<div class="sec-cab"><h2>Antes</h2><span class="fora">' + plural(antigos.length, 'relatório', 'relatórios') + '</span></div><div class="rlista">' + antigos.map((r) => linhaRdo(r, false)).join('') + '</div>' : '') +
    (!S.obraCarregada[o.codigo] ? '<p class="nota">Trazendo os relatórios mais antigos…</p>' : o.total > rdos.length ? '<p class="nota">' + (o.total - rdos.length) + ' relatório(s) da obra ainda não foram lidos da Vobi (a leitura completa termina em algumas horas).</p>' : '');
  ligarLinhasRdo(c);
}

function grupoSemanas(fotos, comObra) {
  const sem = new Map();
  fotos.forEach((f, i) => { const s = segundaDe(f.r.dia); if (!sem.has(s)) sem.set(s, []); sem.get(s).push(i); });
  let h = '';
  sem.forEach((idx, s) => {
    const rd = new Set(idx.map((i) => fotos[i].r.id)).size, ob = new Set(idx.map((i) => fotos[i].r.obra)).size;
    const rel = s === segundaDe(HOJE) ? 'Esta semana' : s === somarDias(segundaDe(HOJE), -7) ? 'Semana passada' : '';
    h += '<section class="semana"><h3>' + (rel ? rel + ' · ' : '') + esc(cap(tituloSemana(s))) + (s.slice(0, 4) !== HOJE.slice(0, 4) ? ' de ' + s.slice(0, 4) : '') + '<span>' + plural(idx.length, 'foto', 'fotos') + (comObra ? ' · ' + plural(ob, 'obra', 'obras') : '') + ' · ' + plural(rd, 'diário', 'diários') + '</span></h3><div class="grade">' +
      idx.map((i) => { const f = fotos[i]; return '<button type="button" class="q" data-f="' + i + '">' + imgK(f, f.t || 'Foto do diário') + '<span class="qd">' + esc(semCurta(f.r.dia) + ' ' + ddmm(f.r.dia)) + '</span><span class="qt">' + esc(comObra ? f.r.obra + (f.t ? ' · ' + f.t : '') : (f.t || 'RDO nº ' + f.r.codigo)) + '</span></button>'; }).join('') + '</div></section>';
  });
  return h;
}
function obraFotos(c, o, rdos) {
  const fotos = fotosDe(rdos);
  c.innerHTML = '<div class="topo"><div><p>' + plural(o.fotos, 'foto', 'fotos') + ' desta obra no acervo' + (fotos.length < o.fotos ? ' · ' + (S.obraCarregada[o.codigo] ? fotos.length + ' lidas até agora' : 'carregando…') : '') + '</p></div>' +
    (fotos.length ? '<button type="button" class="btn pri peq" id="tvF">' + ic('tv') + 'Passar na TV</button>' : '') + '</div>' +
    (fotos.length ? grupoSemanas(fotos, false) : '<div class="vazio"><h3>' + (S.obraCarregada[o.codigo] ? 'Sem fotos no acervo' : 'Carregando as fotos…') + '</h3><p>As fotos que chegam pelos diários ficam guardadas aqui, semana a semana.</p></div>');
  $$('.q', c).forEach((b) => b.addEventListener('click', () => abrirVisor(fotos, Number(b.dataset.f))));
  const tv = $('#tvF', c); if (tv) tv.addEventListener('click', () => abrirSlide(fotos, o.codigo + ' · fotos'));
}

  const obrasF = [...new Set(fotosDe(rd).map((f) => f.r.obra))].sort((a, b) => a.localeCompare(b, 'pt-BR', { numeric: true }));
  if (S.fotoObra && obrasF.indexOf(S.fotoObra) < 0) S.fotoObra = '';
  if (S.fotoObra) rd = rd.filter((r) => r.obra === S.fotoObra);
  const fotos = fotosDe(rd);
  m.innerHTML = '<section class="vista"><div class="topo"><div><h1>Fotos<small>' + fotos.length + '</small></h1><p>As fotos que você manda pelo app 06 ficam guardadas aqui, por obra e por semana.</p></div>' +
    (fotos.length ? '<button type="button" class="btn pri" id="tvTodas">' + ic('tv') + 'Passar na TV</button>' : '') + '</div>' +
    (obrasF.length > 1 ? '<div class="chips"><button type="button" class="chip" data-fo="" aria-pressed="' + !S.fotoObra + '">Todas</button>' + obrasF.map((c) => '<button type="button" class="chip" data-fo="' + esc(c) + '" aria-pressed="' + (S.fotoObra === c) + '">' + esc(c) + '</button>').join('') + '</div>' : '') +
    (fotos.length ? grupoSemanas(fotos, !S.fotoObra && obrasF.length > 1) : '<div class="vazio"><h3>Sem fotos neste período</h3><p>Carregue o mês anterior ou abra a obra (aba Fotos) para ver todas.</p></div>') + botaoMais() + '</section>';
  $$('[data-fo]', m).forEach((b) => b.addEventListener('click', () => { S.fotoObra = b.dataset.fo; render(false); }));
  $$('.grade .q', m).forEach((b) => b.addEventListener('click', () => abrirVisor(fotos, Number(b.dataset.f))));
  const tv = $('#tvTodas', m); if (tv) tv.addEventListener('click', () => abrirSlide(fotos, S.fotoObra ? S.fotoObra + ' · fotos' : 'Fotos das obras'));
  ligarMais(m);
}

/* ---------- camadas: folhas, visualizador, slide ---------- */
function camada(html) {
  const c = $('#camada');
  c.innerHTML = '<div class="veu">' + html + '</div>';
  const v = c.firstChild;
  v.addEventListener('click', (e) => { if (e.target === v && !v.dataset.trava) fecharCamada(); });
  const f = v.querySelector('button, input, select'); if (f) setTimeout(() => f.focus({ preventScroll: true }), 30);
  return v;
}
function fecharCamada() { pararSlide(); $('#camada').innerHTML = ''; document.documentElement.style.overflow = ''; }
document.addEventListener('keydown', (e) => {
  const v = $('#camada .veu');
  if (e.key === 'Escape' && $('#camada').children.length && !(v && v.dataset.trava)) { e.preventDefault(); fecharCamada(); }
});

function abrirLancar(codPre) {
  const minhas = minhasObras().filter((o) => !o.encerrada);
  let esc1 = codPre || (minhas[0] && minhas[0].codigo);
  const link = D.links && D.links.lancar;
  const v = camada('<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="lcT"><h2 id="lcT">Lançar o diário de hoje</h2>' +
    '<p class="d">O lançamento continua no app de lançamento (app 06), que funciona sem sinal. Quando o diário chega na Vobi, ele aparece aqui com as fotos, e as fotos ficam guardadas para você ver depois.</p>' +
    '<div class="pessoas">' + minhas.map((o) => { const hojeOk = D.rdos.some((r) => r.obra === o.codigo && r.dia === HOJE); return '<button type="button" class="pessoa" data-lc="' + esc(o.codigo) + '" aria-pressed="' + (o.codigo === esc1) + '">' + (o.capa ? '<span class="mini">' + capaImg(o) + '</span>' : '<span class="mini">' + esc(o.codigo) + '</span>') + '<span><b>' + esc(o.codigo) + '</b><small>' + esc(o.nome) + '</small></span>' + (hojeOk ? '<span class="tag app">Hoje feito</span>' : '<span class="tag">Hoje pendente</span>') + '</button>'; }).join('') + '</div>' +
    (link ? '' : '<p class="fora">Abra o app 06 pelo ícone no seu celular (o link pessoal não está na planilha).</p>') +
    '<div class="acoes"><button type="button" class="btn" id="lcF">Fechar</button>' + (link ? '<a class="btn pri" id="lcAbre" href="' + esc(link) + '" target="_blank" rel="noopener">' + ic('mais') + 'Abrir o app 06</a>' : '') + '</div></div>');
  pintarMinis(v);
  $$('[data-lc]', v).forEach((b) => b.addEventListener('click', () => { esc1 = b.dataset.lc; $$('[data-lc]', v).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }));
  $('#lcF', v).addEventListener('click', fecharCamada);
  const ab = $('#lcAbre', v); if (ab) ab.addEventListener('click', () => setTimeout(fecharCamada, 100));
}
function abrirPontos(o, pts) {
  const v = camada('<div class="sheet" role="dialog" aria-modal="true"><h2>Pontos a revisar · ' + esc(o.codigo) + '</h2><ul class="pontos">' +
    pts.map((x, i) => '<li><button type="button" data-pt="' + i + '"><span class="s ' + (x.s === 'alto' ? 'alto' : x.s === 'baixo' ? 'info' : '') + '"></span><span class="t">' + esc(x.t) + '</span><span class="pq">' + esc(x.q || '') + '</span></button></li>').join('') + '</ul>' +
    '<div class="acoes"><button type="button" class="btn" id="ptF">Fechar</button></div></div>');
  $$('[data-pt]', v).forEach((b) => b.addEventListener('click', () => { fecharCamada(); pts[Number(b.dataset.pt)].ir(); }));
  $('#ptF', v).addEventListener('click', fecharCamada);
}
function abrirMenu() {
  const p = S.pessoa;
  const painel = D.links && D.links.painel;
  const v = camada('<div class="sheet" role="dialog" aria-modal="true"><div style="display:flex;gap:12px;align-items:center"><span class="eu">' + esc(iniciais(p.nome)) + '</span><div><h2>' + esc(p.nome) + '</h2><p class="d">' + (p.obras === '*' ? 'Todas as obras' : esc(p.obras.join(' · '))) + '</p></div></div>' +
    '<div class="menu-l"><button type="button" id="mnTv">' + ic('tv') + 'Passar as fotos na TV<small>slide em tela cheia</small></button>' +
    (painel ? '<a href="' + esc(painel) + '" target="_blank" rel="noopener" id="mnPainel">' + ic('painel') + 'Painel de atrasos<small>abre numa aba nova</small></a>' : '') +
    '<button type="button" id="mnAtu">' + ic('atualizar') + 'Atualizar agora<small>relê os diários e a equipe</small></button>' +
    '<button type="button" id="mnTroca">' + ic('sair') + 'Trocar pessoa</button></div><p class="fora">Diário de Obra Rijo · v' + esc(D.versao || CFG.versao || '') + '</p></div>');
  $('#mnTv', v).addEventListener('click', () => { fecharCamada(); tvGeral(); });
  $('#mnAtu', v).addEventListener('click', () => { fecharCamada(); toast('Atualizando…'); carregarTudo(true); });
  $('#mnTroca', v).addEventListener('click', () => { fecharCamada(); sair(); });
}
function sair(msg) {
  S.pessoa = null; S.token = null; S.ed = null; D = null; S.pendentes = {}; clearTimeout(S.vigia);
  guardar(TK, null);
  S.pilha = [{ v: 'entrar', p: {} }];
  fecharCamada(); render();
  if (msg) toast(msg);
}
function tvGeral() {
  const a = atual();
  const cod = a.v === 'obra' ? a.p.cod : a.v === 'rdo' || a.v === 'corrigir' ? (RDO[a.p.id] || {}).obra : '';
  const rd = D.rdos.filter((r) => pessoaPode(r.obra) && (!cod || r.obra === cod)).sort((x, y) => (x.dia < y.dia ? 1 : -1));
  const f = fotosDe(rd);
  if (!f.length) { toast('Sem fotos para passar.'); return; }
  abrirSlide(f, cod ? cod + ' · fotos' : 'Fotos das obras');
}

function abrirVisor(lista, i) {
  const v = document.createElement('div');
  v.className = 'visor'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-modal', 'true'); v.setAttribute('aria-label', 'Foto');
  $('#camada').innerHTML = ''; $('#camada').appendChild(v);
  document.documentElement.style.overflow = 'hidden';
  const mostrar = () => {
    const f = lista[i], r = f.r, o = OBRA[r.obra] || { codigo: r.obra, nome: '' };
    v.innerHTML = '<div class="vt"><button type="button" class="vbtn" id="vX" aria-label="Fechar">' + ic('x') + '</button><span class="c num">' + (i + 1) + ' de ' + lista.length + '</span>' +
      '<button type="button" class="vbtn" id="vTv" aria-label="Passar daqui na TV">' + ic('tv') + '</button></div>' +
      '<div class="vf"><img id="vImg" src="' + (GRANDES.get(f.k) || MINIS[f.k] || '') + '" alt="' + esc(f.t || 'Foto do diário') + '">' +
      '<button type="button" class="vbtn nav a" id="vA" aria-label="Anterior"' + (i ? '' : ' hidden') + '>' + ic('voltar') + '</button><button type="button" class="vbtn nav p" id="vP" aria-label="Próxima"' + (i < lista.length - 1 ? '' : ' hidden') + '>' + ic('prox') + '</button></div>' +
      '<div class="vb">' + (f.t ? '<div class="lg">' + esc(f.t) + '</div>' : '') + '<div class="ob">' + esc(nomeObra(o)) + '</div><div class="c" style="color:var(--ink-2);font-size:14px">' + esc(dataLonga(r.dia)) + ' · RDO nº ' + esc(r.codigo) + (engenheiroDe(r) ? ' · ' + esc(engenheiroDe(r)) : '') + '</div>' +
      '<div class="bt"><button type="button" class="btn peq" id="vRdo">' + ic('rel') + 'Abrir o relatório nº ' + esc(r.codigo) + '</button></div></div>';
    const k = f.k;
    if (!GRANDES.has(k)) fotoGrande(f).then((src) => { const im = $('#vImg', v); if (im && lista[i].k === k) im.src = src; }).catch(() => { /* fica a miniatura */ });
    [i + 1, i - 1].forEach((j) => { if (lista[j]) fotoGrande(lista[j]).catch(() => {}); });
    $('#vX', v).addEventListener('click', fecharCamada);
    $('#vA', v).addEventListener('click', () => { if (i > 0) { i--; mostrar(); } });
    $('#vP', v).addEventListener('click', () => { if (i < lista.length - 1) { i++; mostrar(); } });
    $('#vTv', v).addEventListener('click', () => abrirSlide(lista, nomeObra(o), i));
    $('#vRdo', v).addEventListener('click', () => { fecharCamada(); const a = atual(); if (a.v === 'rdo' && a.p.id === r.id) return; ir('rdo', { id: r.id }); });
  };
  let tx = null;
  v.addEventListener('touchstart', (e) => { if (e.touches.length === 1) tx = e.touches[0].clientX; }, { passive: true });
  v.addEventListener('touchend', (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50) { const j = i + (dx < 0 ? 1 : -1); if (j >= 0 && j < lista.length) { i = j; mostrar(); } } });
  v.tecla = (e) => { if (e.key === 'ArrowRight' && i < lista.length - 1) { i++; mostrar(); } if (e.key === 'ArrowLeft' && i > 0) { i--; mostrar(); } };
  mostrar();
}
document.addEventListener('keydown', (e) => { const v = $('#camada .visor'); if (v && v.tecla) v.tecla(e); const s = $('#camada .slide'); if (s && s.tecla) s.tecla(e); });

const SL = { timer: null, i: 0, lista: [], pausado: false, cena: 0, seg: 8, quieto: null, wake: null };
function abrirSlide(lista, titulo, ini) {
  if (!lista.length) return;
  pararSlide();
  const s = document.createElement('div');
  s.className = 'slide'; s.setAttribute('role', 'dialog'); s.setAttribute('aria-label', 'Fotos na TV');
  s.innerHTML = '<div class="cena" id="c0"><img class="fundo" alt=""><img class="foto" alt=""></div><div class="cena" id="c1"><img class="fundo" alt=""><img class="foto" alt=""></div><div class="sv-veu"></div>' +
    '<div class="s-top"><span class="marca-s"><img class="logo" src="' + LOGOS.logo + '" alt="Rijo Engenharia"><img class="iso" src="' + LOGOS.iso + '" alt=""><img class="pbqph" src="' + LOGOS.pbqph + '" alt=""></span>' +
    '<span class="bts"><button type="button" class="vbtn" id="sPausa" aria-label="Pausar">' + ic('pausa') + '</button><button type="button" class="vbtn" id="sTela" aria-label="Tela cheia">' + ic('tela') + '</button><button type="button" class="vbtn" id="sX" aria-label="Fechar">' + ic('x') + '</button></span></div>' +
    '<button type="button" class="vbtn nav a" id="sA" aria-label="Foto anterior">' + ic('voltar') + '</button><button type="button" class="vbtn nav p" id="sP" aria-label="Próxima foto">' + ic('prox') + '</button>' +
    '<div class="s-leg" id="sLeg"><div class="fl" id="sFl"></div><div class="ob" id="sOb"></div><div class="mt" id="sMt"></div></div><div class="s-barra"><i id="sBar"></i></div>';
  $('#camada').innerHTML = ''; $('#camada').appendChild(s);
  document.documentElement.style.overflow = 'hidden';
  Object.assign(SL, { lista, i: (ini || 0) - 1, pausado: false, cena: 0, titulo });
  $('#sX', s).addEventListener('click', fecharCamada);
  $('#sA', s).addEventListener('click', () => slideIr(SL.i - 1));
  $('#sP', s).addEventListener('click', () => slideIr(SL.i + 1));
  $('#sPausa', s).addEventListener('click', () => { SL.pausado = !SL.pausado; s.classList.toggle('pausado', SL.pausado); $('#sPausa', s).innerHTML = ic(SL.pausado ? 'tocar' : 'pausa'); clearTimeout(SL.timer); if (!SL.pausado) SL.timer = setTimeout(() => slideIr(SL.i + 1), SL.seg * 1000); });
  $('#sTela', s).addEventListener('click', () => { try { if (document.fullscreenElement) document.exitFullscreen(); else s.requestFullscreen().catch(() => toast('Use F11 para tela cheia.')); } catch (e) { toast('Use F11 para tela cheia.'); } });
  const acordar = () => { s.classList.remove('quieto'); clearTimeout(SL.quieto); SL.quieto = setTimeout(() => s.classList.add('quieto'), 3000); };
  s.addEventListener('mousemove', acordar); s.addEventListener('pointerdown', acordar); acordar();
  let tx = null;
  s.addEventListener('touchstart', (e) => { if (e.touches.length === 1) tx = e.touches[0].clientX; }, { passive: true });
  s.addEventListener('touchend', (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50) slideIr(SL.i + (dx < 0 ? 1 : -1)); });
  s.tecla = (e) => { if (e.key === 'ArrowRight') slideIr(SL.i + 1); else if (e.key === 'ArrowLeft') slideIr(SL.i - 1); else if (e.key === ' ') { e.preventDefault(); $('#sPausa', s).click(); } acordar(); };
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((w) => { SL.wake = w; }).catch(() => {}); } catch (e) { /* */ }
  slideIr(SL.i + 1);
}
function slideIr(n) {
  const s = $('#camada .slide'); if (!s) return;
  const L = SL.lista; n = ((n % L.length) + L.length) % L.length;
  SL.i = n;
  const f = L[n], r = f.r, o = OBRA[r.obra] || { codigo: r.obra, nome: '' };
  const prox = $('#c' + (1 - SL.cena), s), at = $('#c' + SL.cena, s);
  const pr = GRANDES.get(f.k) || MINIS[f.k] || '';
  prox.querySelector('.foto').src = pr; prox.querySelector('.fundo').src = pr;
  if (!GRANDES.has(f.k)) fotoGrande(f).then((src) => { if (SL.lista[SL.i] && SL.lista[SL.i].k === f.k) { prox.querySelector('.foto').src = src; prox.querySelector('.fundo').src = src; } }).catch(() => {});
  [n + 1, n + 2].forEach((j) => { const g = L[j % L.length]; if (g) fotoGrande(g).catch(() => {}); });
  prox.classList.add('ativa'); at.classList.remove('ativa'); SL.cena = 1 - SL.cena;
  $('#sFl', s).textContent = f.t || '';
  $('#sOb', s).textContent = nomeObra(o);
  $('#sMt', s).innerHTML = '<span>' + esc(dataLonga(r.dia)) + '</span><span>RDO nº ' + esc(r.codigo) + '</span>' + (engenheiroDe(r) ? '<span>' + esc(engenheiroDe(r)) + '</span>' : '') + '<span class="num">' + (n + 1) + ' / ' + L.length + '</span>';
  const b = $('#sBar', s); b.classList.remove('corre'); void b.offsetWidth; b.style.animationDuration = SL.seg + 's'; b.classList.add('corre');
  clearTimeout(SL.timer);
  if (!SL.pausado) SL.timer = setTimeout(() => slideIr(SL.i + 1), SL.seg * 1000);
}
function pararSlide() { clearTimeout(SL.timer); clearTimeout(SL.quieto); try { if (SL.wake) { SL.wake.release(); SL.wake = null; } } catch (e) { /* */ } try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { /* */ } }

let toastT = null;
function toast(t) {
  let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3800);
}

/* ---------- início ---------- */
(function iniciar() {
  $('#mLogo').src = LOGOS.logo; $('#mIso').src = LOGOS.iso; $('#mPbqph').src = LOGOS.pbqph;
  pintarIcones(document);
  $$('[data-tab]').forEach((b) => b.addEventListener('click', () => { if (!D) return; if (S.ed && S.ed.sujo) return pedirDescarte(() => ir(b.dataset.tab, {}, { raiz: true })); S.ed = null; ir(b.dataset.tab, {}, { raiz: true }); }));
  $('#navLancar').addEventListener('click', () => abrirLancar());
  $('#cabLancar').addEventListener('click', () => abrirLancar());
  $('#navTv').addEventListener('click', tvGeral);
  $('#cabTv').addEventListener('click', tvGeral);
  $('#eu').addEventListener('click', abrirMenu);
  window.addEventListener('beforeunload', (e) => { if (S.ed && S.ed.sujo) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && D && S.token && Date.now() - (S.lidoEm || 0) > 15 * 60000 && !S.ed) { S.lidoEm = Date.now(); carregarTudo(true); } });
  S.token = lerGuardado(TK);
  S.pilha = [{ v: 'entrar', p: {} }];
  if (S.token) { S.lidoEm = Date.now(); carregarTudo(); } else render();
})();
</script>
